[build]
  command = "pnpm install --frozen-lockfile"
  publish = "public"

[build.environment]
  # Netlify Functions run on AWS Lambda, whose newest Node runtime is 24. The build must
  # use the same major so node-libcurl's prebuilt binary matches the runtime ABI.
  NODE_VERSION = "24"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # native addon: keep it out of the bundle and ship its files alongside
  external_node_modules = ["node-libcurl"]
  included_files = ["node_modules/node-libcurl/**"]
